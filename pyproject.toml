[project]
name = "wezas-toolkit-workspace"
version = "0.0.0"
description = "Workspace racine du Wezas Africa Toolkit (non publié)."
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "types-pyyaml"]

[tool.uv.workspace]
members = ["packages/core", "packages/mcp-server"]

[tool.uv.sources]
wezas-core = { workspace = true }
wezas-africa-toolkit = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
