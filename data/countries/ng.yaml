  - ha
  - yo
  - ig
timezones:
  - Africa/Lagos
numbering_plan:
  national_length: 10
  trunk_prefix: "0"
  ranges:
    - type: mobile
      prefixes: ["803", "806", "813", "816", "810", "814", "903", "906", "703", "706", "704", "702"]
      operator: mtn-ng
    - type: mobile
      prefixes: ["802", "808", "812", "701", "708", "902", "904", "907", "901"]
      operator: airtel-ng
    - type: mobile
      prefixes: ["805", "807", "815", "811", "705", "905"]
      operator: glo-ng
    - type: mobile
      prefixes: ["809", "817", "818", "909", "908"]
      operator: 9mobile-ng
