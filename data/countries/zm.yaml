numbering_plan:
  national_length: 9
  trunk_prefix: "0"
  ranges:
    - type: mobile
      prefixes: ["97", "77"]
      operator: airtel-zm
    - type: mobile
      prefixes: ["96", "76"]
      operator: mtn-zm
    - type: mobile
      prefixes: ["95", "75"]
      operator: zamtel-zm
    - type: fixed
      prefixes: ["21"]
mobile_money:
  - "Airtel Money"
  - "MTN MoMo"
  - "Zamtel Kwacha"
