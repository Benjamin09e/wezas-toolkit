[project]
name = "wezas-api"
version = "0.1.0"
description = "API REST hébergée et services en ligne pour Wezas Africa Toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Wezas Team", email = "contact@wezas.africa" }
]
dependencies = [
    "wezas-core",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
