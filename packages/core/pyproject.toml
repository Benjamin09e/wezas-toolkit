[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wezas-core"
version = "0.1.0.dev0"
description = "Logique métier pure du Wezas Africa Toolkit (hors ligne, sans clé)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7", "pyyaml>=6"]

[tool.hatch.build.targets.wheel]
packages = ["wezas_core"]
